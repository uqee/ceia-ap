[project]
name = "ceia-ap"
version = "0.1.0"
description = "Material de clases de Deep Learning (CEIA - FIUBA)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=6.23.0",
    "ipython>=8.12.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.1",
    # torch 2.2.2's C extensions are built against the NumPy 1.x ABI
    "numpy>=1.24.3,<2",
    "pandas>=2.0.1",
    "pytorch-lightning>=2.0.0",
    "scikit-learn>=1.2.2",
    "scipy>=1.10.1",
    "seaborn>=0.12.2",
    # torch dropped Intel macOS (x86_64) wheels after 2.2.2; capped so `uv sync` resolves on this machine
    "torch>=2.0.1,<2.3",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.0.0",
    "torchsummary>=1.5.1",
    "torchvision>=0.15.2,<0.18",
    "tqdm>=4.65.0",
    "wandb>=0.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
